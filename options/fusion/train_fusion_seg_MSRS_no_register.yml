# general settings
name: RFEPFusion_fusion_seg_no_register
model_type: RFEPFusionModel
scale: 1
num_gpu: 5
manual_seed: 666
# the size of the input image must be a multiple of 16
# Padding in case images are not multiples of 16
# pad_size: 16  
# pad_size: 4
# use_lq_for_l_color: true   # 以lq(low)作为color loss的GT
use_amp: true
infer_slide_max_size: 640  # 图片超过多少就启用滑窗推理

# dataset and data loader settings
datasets:
  train:
    name: fusion_seg_no_reg_TrainSet
    type: MSRSDataset
    dataroot: /home/hongyuchen/master_thesis/MSRSdataset/train/
    vi_dir_name: vi
    ir_dir_name: ir
    seg_dir_name: Segmentation_labels
    mask_dir_name: mask
    io_backend:
      type: disk

    gt_size: [480, 360]  # [weight, height]
    use_hflip: true
    use_rot: false  # if weight != height, then use_rot must be false

    # data loader
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    # dataset_enlarge_ratio: 200
    prefetch_mode: ~

  val:
    name: fusion_seg_no_reg_ValSet
    type: MSRSDataset
    dataroot: /home/hongyuchen/master_thesis/MSRSdataset/test/
    vi_dir_name: vi
    ir_dir_name: ir
    seg_dir_name: Segmentation_labels    
    io_backend:
      type: disk


# network structures
network_g:
  type: RFEPFusion_no_register
  vi_settings: hyc_small
  ir_settings: tiny

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  # ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 2e-4  # 初始学习率，实际上不会被用到
    weight_decay: 0.0001
    betas: [0.9, 0.99]

  use_grad_clip: true
  max_grad_norm: 0.01  
    
  # mixing_augs:
  #   mixup: true
  #   mixup_beta: 1.2
  #   use_identity: true

  # iter-based training
  total_iter: 180000  
  # total_epoch: 500
  warmup_iter: -1  # no warm up
  scheduler:
    type: OneCycleLR
    max_lr: !!float 5e-4
    total_steps: 180000  # 保持和total_iter一致 
    pct_start: 0.2
    div_factor: 10
    final_div_factor: 500
    # last_epoch: -1  # 这个参数在base_model里的resume_training自动会设置好

  # losses
  losses:
    fusion_loss:

    seg_loss:
  # pixel_opt:
  #   # type: CharbonnierLoss
  #   type: L1Loss
  #   loss_weight: 1.0
  #   reduction: mean
  # color_loss:
  #   type: ColorLoss
  #   loss_weight: 0.4
  #   reduction: mean
  

# validation settings
val:
  val_freq: !!float 1000
  save_img: false

  # pbar: true

  metrics:
    # psnr: # metric name, can be arbitrary
    #   type: calculate_psnr
    #   crop_border: 0
    #   test_y_channel: false
    # niqe:
    #   type: calculate_niqe
    #   crop_border: 0
    #   better: lower  # the lower, the better 只要设置不是“higher”，就是越小越好

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 1000
  save_checkpoint_max_num: 10
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

# find_unused_parameters: true
