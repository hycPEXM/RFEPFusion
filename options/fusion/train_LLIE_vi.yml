# general settings
name: RFEPFusion_LLIE_vi
model_type: LLIEModel_VI
scale: 1
num_gpu: 5
manual_seed: 666
# the size of the input image must be a multiple of 16
# Padding in case images are not multiples of 16
# pad_size: 16  
# pad_size: 4

use_amp: true

# dataset and data loader settings
datasets:
  train:
    name: LLIE_vi_TrainSet
    type: PairedImageDatasetLLIE
    dataroot: /home/hongyuchen/master_thesis/nighttime-for-LLIE-v2
    vi_dir_name: vi
    ir_dir_name: ir
    dataset_list: 
      - dataset_name: LLVIP
        multi_ratio: 2
      - dataset_name: M3FD
        multi_ratio: 2
      - dataset_name: MSRS
        multi_ratio: 3
      - dataset_name: RoadScene
        multi_ratio: 1
    io_backend:
      type: disk

    # IMAGENET_INCEPTION_MEAN: mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

    gt_size: [320, 240]  # [weight, height]
    use_hflip: true
    use_rot: false  # if weight != height, then use_rot must be false

    # data loader
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    # dataset_enlarge_ratio: 200
    prefetch_mode: ~

  val:
    name: LLIE_vi_ValSet
    type: SingleImageDataset
    dataroot_lq: /home/hongyuchen/master_thesis/nighttime-for-LLIE-v2/LLVIP_test/vi
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    io_backend:
      type: disk


# network structures
network_g:
  type: LLIE_VI

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  # ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 2e-4  # 初始学习率，实际上不会被用到
    weight_decay: 0.005
    betas: [0.9, 0.99]

  use_grad_clip: true
  max_grad_norm: 0.01  
    
  # mixing_augs:
  #   mixup: true
  #   mixup_beta: 1.2
  #   use_identity: true

  total_iter: 90000  
  # total_epoch: 500
  warmup_iter: -1  # no warm up
  scheduler:
    type: OneCycleLR
    max_lr: !!float 5e-4
    total_steps: 90000  # 保持和total_iter一致 
    pct_start: 0.2
    div_factor: 10
    final_div_factor: 500
    # last_epoch: -1  # 这个参数在base_model里的resume_training自动会设置好

  # losses
  pixel_opt:
    # type: CharbonnierLoss
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  color_loss:
    type: ColorLoss
    loss_weight: 0.4
    reduction: mean
  

# validation settings
val:
  val_freq: !!float 500
  save_img: false

  # pbar: true

  metrics:
    # psnr: # metric name, can be arbitrary
    #   type: calculate_psnr
    #   crop_border: 0
    #   test_y_channel: false
    niqe:
      type: calculate_niqe
      crop_border: 0
      better: lower  # the lower, the better 只要设置不是“higher”，就是越小越好

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 500
  save_checkpoint_max_num: 10
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

# find_unused_parameters: true
